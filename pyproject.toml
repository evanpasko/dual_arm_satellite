[project]
name = "dual-arm-satellite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "etpasko@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
]

[project.scripts]
dual-arm-satellite = "dual_arm_satellite:main"
dual-arm-satellite-sim = "dual_arm_satellite.physics_demo:main"
dual-arm-satellite-teleop = "dual_arm_satellite.teleop_live:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dual_arm_satellite", "src/physics_sim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
]
